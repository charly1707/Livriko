services:
  - type: web
    name: livriko
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAPS_API_URL
        value: https://router.project-osrm.org
      - key: PAYMENT_CURRENCY
        value: XOF
      - key: ADMIN_EMAIL
        value: auriol@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
